name: Refresh data

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 7-8 AM Pacific, after overnight stat updates
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scraper
        run: python nba_draftees.py --out docs/NBA_Active_Draftees_by_Team.xlsx --app docs/index.html --cache-hours 0
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git push
